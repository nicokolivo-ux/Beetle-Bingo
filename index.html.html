<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Bingo Beetle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fbf7ee;--card:#fff;--ink:#2a2118;--mute:#7a6c5c;--acc:#2f7d4f;--line:#e4dccb;--mark:#f2b134;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1712;--card:#27231c;--ink:#f3ecdf;--mute:#a79a86;--line:#3a352b;--acc:#58b97f}}
:root[data-theme="dark"]{--bg:#1a1712;--card:#27231c;--ink:#f3ecdf;--mute:#a79a86;--line:#3a352b;--acc:#58b97f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:8px 0 2px;text-align:center}.sub{text-align:center;color:var(--mute);margin:0 0 18px}
.big{font-size:64px;text-align:center}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;background:var(--acc);color:#fff;font-weight:700;width:100%;margin:6px 0;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button.sm{width:auto;padding:8px 12px;font-size:14px}
input{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;text-transform:uppercase;text-align:center;letter-spacing:3px}
.seasons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seasons button{flex:1;min-width:70px;padding:10px 4px;font-size:14px;margin:0}
.seasons button.on{background:var(--sc);color:#fff;border-color:var(--sc)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}
.cell{aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;text-align:center;padding:2px;cursor:pointer;line-height:1.1;color:var(--ink);font-weight:600;margin:0;width:auto}
.cell b{font-size:24px;font-weight:400}
.cell.m{background:var(--mark);border-color:var(--mark);color:#2a2118}
.cell.called:not(.m){border-color:var(--sc)}
.call{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center;min-height:84px}
.call b{font-size:40px;display:block;font-weight:400}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100px}
.mini i{aspect-ratio:1;background:var(--line);border-radius:3px}.mini i.m{background:var(--mark)}
.msg{text-align:center;font-weight:700;min-height:24px;margin:4px 0}
.hist{color:var(--mute);font-size:13px;text-align:center;margin:6px 0}
.code{font-size:34px;letter-spacing:6px;text-align:center;font-weight:800;background:var(--card);border-radius:14px;padding:8px;border:2px dashed var(--line)}
.me{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}.me b{font-size:18px}
.opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.opts button{width:auto;margin:0;text-transform:capitalize}
.opts .sw{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid var(--line)}.opts .sw.on{border-color:var(--ink)}
.opts .alt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.peers{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.peers span{display:flex;flex-direction:column;align-items:center}.peers small{font-size:11px;color:var(--mute)}
.vs{display:flex;gap:10px;justify-content:center;align-items:center}
.tok{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:2px 10px;font-weight:700;font-size:14px;white-space:nowrap}
button:disabled{opacity:.45;cursor:default}h2{font-size:16px;margin:14px 0 4px}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.item button{margin:0;width:100%}
.q{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;margin:6px 0}.q button{width:auto;margin:0}
</style></head><body><main id="app"></main>
<script>
const SEASONS={
winter:{n:'Winter',e:'❄️',c:'#3a7bd5',items:['⛄ Snowman','🧣 Scarf','☕ Hot cocoa','🧤 Mittens','🎿 Skiing','🕯️ Candle','🧦 Warm socks','🎄 Pine tree','🔥 Fireplace','🛷 Sled','🐧 Penguin','🌨️ Snowfall','🥶 Frosty breath','🎁 Gift','🧊 Icicle','🏂 Snowboard','🍲 Hot soup','🌙 Long night','🦌 Reindeer','⛸️ Ice skates','🧸 Blanket fort','🍪 Cookies','⭐ Starry sky','🪟 Frosted window','🐻‍❄️ Polar bear','🥾 Snow boots','🎆 New Year','🫖 Tea']},
spring:{n:'Spring',e:'🌸',c:'#d6478a',items:['🌷 Tulip','🐝 Bee','🌧️ April shower','🐣 Chick','🌈 Rainbow','🦋 Butterfly','🌱 Sprout','🐰 Bunny','🪁 Kite','🌼 Daisy','🐦 Robin','🥚 Egg hunt','🧺 Picnic basket','☔ Umbrella','🌳 Blossoms','🐸 Frog','🪴 Planting','🍃 Fresh breeze','🐞 Ladybug','🌤️ Sunshine','🧹 Spring cleaning','🐑 Lamb','🌻 Seeds','🥬 Garden','🚲 Bike ride','🐛 Caterpillar','🍓 Strawberry','💐 Bouquet']},
summer:{n:'Summer',e:'☀️',c:'#e8830c',items:['🏖️ Beach','🍦 Ice cream','🕶️ Sunglasses','🏊 Swimming','🍉 Watermelon','🦀 Crab','🌴 Palm tree','⛺ Camping','🎆 Fireworks','🍔 BBQ','🌊 Wave','🐚 Seashell','🧴 Sunscreen','🏄 Surfing','🦟 Mosquito','🍋 Lemonade','🔥 Campfire','🩴 Flip-flops','🌅 Sunset','🌻 Sunflower','🚲 Bike','🦗 Cricket song','🏐 Volleyball','🌽 Corn on the cob','🪰 Firefly','🎣 Fishing','🚤 Boat','⛱️ Umbrella']},
autumn:{n:'Autumn',e:'🍂',c:'#c2570c',items:['🍂 Falling leaves','🎃 Pumpkin','🍎 Apple','🌰 Acorn','🧥 Cozy sweater','🦃 Turkey','🍁 Maple leaf','🌾 Hay bale','🥧 Pumpkin pie','🦉 Owl','🍄 Mushroom','🐿️ Squirrel','🕸️ Cobweb','🔥 Bonfire','☕ Spiced latte','🌽 Corn maze','👻 Ghost','🍬 Candy','🧣 Scarf','🌕 Harvest moon','🍇 Grapes','🍯 Cider','🥾 Hiking boots','🦌 Deer','🪵 Firewood','🌬️ Crisp wind','🍠 Sweet potato','🪲 Beetle']},
japan:{n:'Japanese Food',e:'🍣',c:'#c8312f',items:['🍣 Sushi','🍜 Ramen','🍤 Tempura','🍙 Onigiri','🍡 Dango','🍢 Oden','🥟 Gyoza','🍵 Matcha','🍶 Sake','🍱 Bento','🍛 Katsu curry','🐟 Sashimi','🍘 Senbei','🥢 Chopsticks','🍥 Narutomaki','🥚 Tamago','🍧 Kakigori','🥮 Mochi','🥩 Yakiniku','🍗 Yakitori','🌱 Edamame','🍲 Nabe hot pot','🐙 Takoyaki','🍚 Donburi','🍠 Yaki imo','🥒 Tsukemono','🌿 Nori','🍳 Okonomiyaki']},
usa:{n:'American Food',e:'🍔',c:'#2b5fa8',items:['🍔 Cheeseburger','🌭 Hot dog','🍕 Pizza','🍟 Fries','🍗 Fried chicken','🥞 Pancakes','🧇 Waffles','🍩 Donut','🍪 Cookie','🥧 Apple pie','🌮 Taco','🥪 Club sandwich','🍿 Popcorn','🥓 Bacon','🍳 Eggs','🧀 Mac and cheese','🍖 BBQ ribs','🥤 Milkshake','🍫 Brownie','🌽 Corn dog','🥜 Peanut butter','🍦 Soft serve','🦞 Lobster roll','🥣 Chili','🍞 Biscuits','🥗 Cobb salad','🥩 Steak','🍰 Cheesecake']}};
const ORDER=['winter','spring','summer','autumn','japan','usa'];
const $=s=>document.querySelector(s),app=$('#app');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const LINES=[];for(let i=0;i<5;i++){LINES.push([0,1,2,3,4].map(k=>i*5+k),[0,1,2,3,4].map(k=>k*5+i))}
LINES.push([0,6,12,18,24],[4,8,12,16,20]);
const seasonNow=()=>{const m=new Date().getMonth();return m<2||m==11?'winter':m<5?'spring':m<8?'summer':'autumn'};
let G={season:seasonNow()};let timers=[],room=null,unsubs=[];
const stop=()=>{timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[];unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[]};
const mkCard=s=>{const c=shuf(SEASONS[s].items).slice(0,24);c.splice(12,0,null);return c};
const won=(card,marked,called)=>LINES.some(l=>l.every(i=>i==12||(marked.has(i)&&called.has(card[i]))));
const set=s=>{document.documentElement.style.setProperty('--sc',SEASONS[s].c)};
const COLORS=['#2f7d4f','#c2570c','#3a7bd5','#d6478a','#7b4fc9','#2a2118','#e0b01c','#14b8a6','#ff6b6b','#d4a017'],HATS=['none','crown','party','cap','bow','flower','tophat','wizard','halo','pirate'],FACES=['happy','cool','wink','monocle','hearts'],GEARS=['none','bowtie','scarf','headphones','wings'],SPOTS=['dots','stripe','none'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanAV=a=>{a=a||{};return{name:String(a.name||'Beetle').slice(0,12),color:/^#[0-9a-f]{6}$/i.test(a.color)?a.color:COLORS[0],hat:HATS.includes(a.hat)?a.hat:'none',face:FACES.includes(a.face)?a.face:'happy',gear:GEARS.includes(a.gear)?a.gear:'none',spots:SPOTS.includes(a.spots)?a.spots:'dots'}};
let AV=cleanAV({hat:'crown'});try{const s=JSON.parse(localStorage.getItem('bbav')||'null');if(s)AV=cleanAV(s)}catch(e){}
const saveAV=()=>{try{localStorage.setItem('bbav',JSON.stringify(AV))}catch(e){}};
const day=()=>new Date().toISOString().slice(0,10);
let P={t:0,own:[],wins:0,games:0,cpuWins:0,friendWins:0,themes:[],claimed:[],d:day(),dg:0,dw:0};
try{const s=JSON.parse(localStorage.getItem('bbprog')||'null');if(s)P=Object.assign(P,s)}catch(e){}
if(P.d!=day())Object.assign(P,{d:day(),dg:0,dw:0});
const saveP=()=>{try{localStorage.setItem('bbprog',JSON.stringify(P))}catch(e){}};
const SHOP=[{id:'c_teal',k:'color',v:'#14b8a6',p:10,n:'Teal shell'},{id:'c_coral',k:'color',v:'#ff6b6b',p:10,n:'Coral shell'},{id:'c_gold',k:'color',v:'#d4a017',p:30,n:'Golden shell'},{id:'g_bow',k:'gear',v:'bowtie',p:15,n:'Bow tie'},{id:'g_scarf',k:'gear',v:'scarf',p:20,n:'Scarf'},{id:'h_top',k:'hat',v:'tophat',p:20,n:'Top hat'},{id:'f_mon',k:'face',v:'monocle',p:25,n:'Monocle'},{id:'h_wiz',k:'hat',v:'wizard',p:30,n:'Wizard hat'},{id:'f_hrt',k:'face',v:'hearts',p:30,n:'Heart eyes'},{id:'h_pir',k:'hat',v:'pirate',p:35,n:'Pirate hat'},{id:'g_head',k:'gear',v:'headphones',p:35,n:'Headphones'},{id:'h_halo',k:'hat',v:'halo',p:40,n:'Halo'},{id:'g_wing',k:'gear',v:'wings',p:50,n:'Fairy wings'}];
const has=(k,v)=>{const s=SHOP.find(x=>x.k==k&&x.v==v);return !s||P.own.includes(s.id)};
const QS=[{id:'g1',n:'Play your first game',r:5,g:1,v:()=>P.games},{id:'w1',n:'Win a game',r:10,g:1,v:()=>P.wins},{id:'s1',n:'Buy something in the shop',r:5,g:1,v:()=>P.own.length},{id:'t3',n:'Play 3 different themes',r:15,g:3,v:()=>P.themes.length},{id:'b3',n:'Beat the Beetle 3 times',r:20,g:3,v:()=>P.cpuWins},{id:'f1',n:'Win a game with friends',r:20,g:1,v:()=>P.friendWins},{id:'w5',n:'Win 5 games',r:25,g:5,v:()=>P.wins}];
const DQ=[{id:'dp',n:'Play 2 games today',r:5,g:2,v:()=>P.dg},{id:'dw',n:'Win a game today',r:8,g:1,v:()=>P.dw}];
function record(win,mode){P.games++;P.dg++;if(!P.themes.includes(G.season))P.themes.push(G.season);let gain=0;if(win){P.wins++;P.dw++;if(mode=='cpu'){P.cpuWins++;gain=10}else{P.friendWins++;gain=15}P.t+=gain}saveP();return gain}
const BEETLE={name:'Beetle',color:'#2a2118',hat:'none',face:'cool',spots:'dots'};
function avSVG(a,px){a=cleanAV(a);const c=a.color,k='stroke="#2a2118" stroke-width="2.5"';
let s=`<svg viewBox="0 -12 100 112" width="${px}" height="${px}" aria-hidden="true"><path d="M22 52L8 46M22 66L6 68M24 80L10 90M78 52L92 46M78 66L94 68M76 80L90 90M44 14L36 4M56 14L64 4" fill="none" stroke="#2a2118" stroke-width="3" stroke-linecap="round"/>`;
if(a.gear=='wings')s+='<path d="M30 50Q-4 20 8 70Q22 66 30 70Z" fill="#fff" opacity=".85" stroke="#2a2118" stroke-width="2"/><path d="M70 50Q104 20 92 70Q78 66 70 70Z" fill="#fff" opacity=".85" stroke="#2a2118" stroke-width="2"/>';
s+=`<ellipse cx="50" cy="62" rx="30" ry="32" fill="${c}" ${k}/><path d="M50 34V94" stroke="#2a2118" stroke-width="2" opacity=".5"/>`;
if(a.spots=='dots')s+=[[36,58],[64,58],[38,78],[62,78]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#fff" opacity=".75"/>`).join('');
if(a.spots=='stripe')s+=`<path d="M24 56H76M22 72H78" stroke="#fff" stroke-width="5" opacity=".7"/>`;
s+=`<circle cx="50" cy="28" r="15" fill="${c}" ${k}/>`;
const eye=x=>`<circle cx="${x}" cy="26" r="4" fill="#fff"/><circle cx="${x}" cy="26" r="2" fill="#111"/>`;
if(a.face=='happy')s+=eye(43)+eye(57);
if(a.face=='cool')s+=`<rect x="36" y="21" width="28" height="10" rx="4" fill="#111"/>`;
if(a.face=='wink')s+=eye(43)+`<path d="M53 26Q57 22 61 26" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>`;
if(a.face=='monocle')s+=eye(43)+eye(57)+'<circle cx="57" cy="26" r="7" fill="none" stroke="#d4a017" stroke-width="2"/><path d="M63 29Q70 40 66 52" fill="none" stroke="#d4a017" stroke-width="1.5"/>';
if(a.face=='hearts')s+='<text x="43" y="31" font-size="11" text-anchor="middle">❤️</text><text x="57" y="31" font-size="11" text-anchor="middle">❤️</text>';
s+=`<path d="M44 35Q50 40 56 35" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>`;
if(a.hat=='crown')s+=`<path d="M37 16L39 2L45 10L50 0L55 10L61 2L63 16Z" fill="#f2b134" ${k}/>`;
if(a.hat=='party')s+=`<path d="M40 16L50 -10L60 16Z" fill="#d6478a" ${k}/><circle cx="50" cy="-10" r="3" fill="#f2b134"/>`;
if(a.hat=='cap')s+=`<path d="M35 18Q50 -4 65 18Z" fill="#3a7bd5" ${k}/><rect x="58" y="15" width="20" height="5" rx="2" fill="#3a7bd5" ${k}/>`;
if(a.hat=='bow')s+=`<path d="M50 10L36 2V18ZM50 10L64 2V18Z" fill="#d6478a" ${k}/><circle cx="50" cy="10" r="4" fill="#d6478a" ${k}/>`;
if(a.hat=='tophat')s+=`<rect x="38" y="-8" width="24" height="22" fill="#222" ${k}/><rect x="32" y="12" width="36" height="5" rx="2" fill="#222" ${k}/><rect x="38" y="6" width="24" height="4" fill="#c8312f"/>`;
if(a.hat=='wizard')s+=`<path d="M36 17L50 -14L64 17Z" fill="#5b3fa8" ${k}/><ellipse cx="50" cy="17" rx="19" ry="4" fill="#5b3fa8" ${k}/><circle cx="50" cy="5" r="3" fill="#f2b134"/>`;
if(a.hat=='halo')s+=`<ellipse cx="50" cy="2" rx="14" ry="4" fill="none" stroke="#f2b134" stroke-width="4"/>`;
if(a.hat=='pirate')s+=`<path d="M33 18Q50 -8 67 18Z" fill="#111" ${k}/><circle cx="50" cy="8" r="3.5" fill="#fff"/>`;
if(a.hat=='flower')s+=[[50,6],[44,10],[56,10],[46,16],[54,16]].map(p=>`<circle cx="${p[0]}" cy="${p[1]-2}" r="5" fill="#fff" ${k}/>`).join('')+`<circle cx="50" cy="8" r="4" fill="#f2b134"/>`;
if(a.gear=='bowtie')s+=`<path d="M50 46L37 39V53ZM50 46L63 39V53Z" fill="#d6478a" ${k}/><circle cx="50" cy="46" r="4" fill="#d6478a" ${k}/>`;
if(a.gear=='scarf')s+=`<rect x="34" y="40" width="32" height="8" rx="4" fill="#c8312f" ${k}/><rect x="56" y="44" width="8" height="18" rx="3" fill="#c8312f" ${k}/>`;
if(a.gear=='headphones')s+=`<path d="M33 30Q33 8 50 8Q67 8 67 30" fill="none" stroke="#333" stroke-width="4"/><rect x="29" y="26" width="8" height="14" rx="3" fill="#333"/><rect x="63" y="26" width="8" height="14" rx="3" fill="#333"/>`;
return s+'</svg>'}
function editAV(){stop();
app.innerHTML=`<h1>Your beetle</h1><div class="big" id="pv">${avSVG(AV,150)}</div>
<input id="nm" maxlength="12" value="${esc(AV.name)}" style="text-transform:none;letter-spacing:0">
<p class="hist">Color</p><div class="opts">${COLORS.filter(c=>has('color',c)).map(c=>`<button class="sw ${c==AV.color?'on':''}" data-k="color" data-v="${c}" aria-label="${c}" style="background:${c}"></button>`).join('')}</div>
${[['hat',HATS],['face',FACES],['gear',GEARS],['spots',SPOTS]].map(([k,l])=>`<p class="hist">${k[0].toUpperCase()+k.slice(1)}</p><div class="opts">${l.filter(v=>has(k,v)).map(v=>`<button class="alt sm ${AV[k]==v?'on':''}" data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div>`).join('')}
<button id="ok">Done</button>`;
$('#nm').oninput=e=>{AV.name=e.target.value.slice(0,12)};
app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{AV[b.dataset.k]=b.dataset.v;editAV()});
$('#ok').onclick=()=>{AV=cleanAV(AV);saveAV();home()}}
function shop(msg){stop();set(G.season);
app.innerHTML=`<div class="bar"><button class="alt sm" id="x">← Back</button><b>🛍️ Shop</b><span class="tok">🪙 ${P.t}</span></div><p class="msg">${msg||'Spend your Beetle tokens!'}</p>
<div class="shop">${SHOP.map(s=>{const o=P.own.includes(s.id);return `<div class="item">${avSVG(Object.assign({},AV,{[s.k]:s.v}),64)}<b>${s.n}</b><button class="sm ${o?'alt':''}" data-b="${s.id}" ${o?'disabled':''}>${o?'Owned ✓':'🪙 '+s.p}</button></div>`}).join('')}</div>`;
$('#x').onclick=home;
app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const s=SHOP.find(x=>x.id==b.dataset.b);if(!s||P.own.includes(s.id))return;
if(P.t<s.p)return shop('Not enough tokens yet. Win games and finish quests!');
P.t-=s.p;P.own.push(s.id);AV[s.k]=s.v;saveP();saveAV();shop('Bought and equipped: '+s.n+'!')})}
function quests(){stop();set(G.season);
const L=[...QS.map(q=>[q,q.id]),...DQ.map(q=>[q,q.id+':'+P.d])];
const row=([q,key])=>{const c=P.claimed.includes(key),v=Math.min(q.v(),q.g);return `<div class="q"><div><b>${q.n}</b><div class="hist" style="margin:0;text-align:left">${v}/${q.g} · 🪙 ${q.r}</div></div>${c?'<b>✓</b>':`<button class="sm" data-q="${key}" ${v>=q.g?'':'disabled'}>Claim</button>`}</div>`};
app.innerHTML=`<div class="bar"><button class="alt sm" id="x">← Back</button><b>📜 Quests</b><span class="tok">🪙 ${P.t}</span></div><h2>Daily</h2>${L.slice(QS.length).map(row).join('')}<h2>Adventures</h2>${L.slice(0,QS.length).map(row).join('')}`;
$('#x').onclick=home;
app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const e=L.find(x=>x[1]==b.dataset.q);if(e&&!P.claimed.includes(e[1])&&e[0].v()>=e[0].g){P.claimed.push(e[1]);P.t+=e[0].r;saveP();quests()}})}

function home(){stop();G.mode=null;set(G.season);
app.innerHTML=`<div class="big">🪲</div><h1>Bingo Beetle</h1><p class="sub">Seasonal and foodie bingo for beetles and friends</p>
<div class="seasons">${ORDER.map(s=>`<button class="alt ${s==G.season?'on':''}" data-s="${s}">${SEASONS[s].e} ${SEASONS[s].n}</button>`).join('')}</div>
<p class="hist">Today’s pick: ${SEASONS[seasonNow()].n} card</p>
<div class="me">${avSVG(AV,56)}<div><b>${esc(AV.name)}</b> <span class="tok">🪙 ${P.t}</span><br><button class="alt sm" id="av">✏️ Customize</button></div></div>
<button id="cpu">🪲 Play the Beetle</button><button id="fr" class="alt">👫 Play with friends</button><button id="qs" class="alt">📜 Quests</button><button id="sh" class="alt">🛍️ Shop</button>`;
app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{G.season=b.dataset.s;home()});
$('#av').onclick=editAV;$('#qs').onclick=()=>quests();$('#sh').onclick=()=>shop();$('#cpu').onclick=()=>game('cpu');$('#fr').onclick=lobby}

function lobby(){stop();set(G.season);
app.innerHTML=`<h1>Play with friends</h1><p class="sub">Online or in the same room. Everyone opens this page and enters the same code.</p>
<input id="code" maxlength="6" placeholder="CODE"><button id="join">Join game</button>
<button id="host" class="alt">Host a new game</button><button id="back" class="alt">← Back</button><div class="msg" id="m"></div>`;
$('#back').onclick=home;
$('#host').onclick=()=>{const c=Math.random().toString(36).slice(2,6).toUpperCase();game('room',c,true)};
$('#join').onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(c.length<3)return $('#m').textContent='Enter a code first';game('room',c,false)}}

async function game(mode,code,host){stop();
G.mode=mode;G.card=mkCard(G.season);G.marked=new Set([12]);G.called=new Set();G.order=[];G.over=false;
G.bcard=mkCard(G.season);G.bmarked=new Set([12]);G.host=host;G.code=code;
const pool=SEASONS[G.season].items;G.deck=shuf(pool);
draw();
if(mode=='cpu'){setTimeout(next,1200);timers.push(setInterval(()=>{if(!G.over)next()},4500))}
else{
 const r=typeof claude=='undefined'?null:await claude.use('room');
 if(!r){app.innerHTML='<h1>Online play isn’t available here</h1><p class="sub">Open this page from the Claude app or site to play with friends.</p><button id="b">← Back</button>';$('#b').onclick=home;return}
 try{room=await r.join('bb'+code.toLowerCase())}catch(e){room=r}
 unsubs.push(room.on('ball',m=>{if(!m.isMe){applyState(m.data)}}));
 unsubs.push(room.on('hello',m=>{if(G.host&&!m.isMe)sendState()}));
 unsubs.push(room.on('win',m=>{if(!m.isMe){G.over=true;record(false,'room');G.msg='🏆 '+esc(String(m.data&&m.data.name||'A friend').slice(0,20))+' got BINGO!';draw()}}));
 room.emit('hello',{});
 try{await room.presence({av:cleanAV(AV)});unsubs.push(room.onPeers(ch=>{G.peers=ch.peers.filter(p=>p.presence&&p.presence.av).map(p=>({me:p.isMe,av:cleanAV(p.presence.av)}));if(G.mode=='room')draw()}))}catch(e){}
 if(host)G.msg='Share the code, then tap Draw!';else G.msg='Waiting for the caller…'}
draw()}
const sendState=()=>room&&room.emit('ball',{season:G.season,order:G.order});
function applyState(d){if(!d||!SEASONS[d.season])return;
 if(d.season!=G.season||(!G.order.length&&!G.over)&&d.season!=G.season){}
 if(d.season!=G.season){G.season=d.season;G.card=mkCard(G.season);G.marked=new Set([12]);set(G.season)}
 const known=new Set(SEASONS[G.season].items);
 G.order=d.order.filter(x=>known.has(x)).slice(0,60);G.called=new Set(G.order);G.msg='';draw()}
function next(){if(G.over)return;
 const n=G.deck.find(x=>!G.called.has(x));if(!n){G.over=true;G.msg='All called — it’s a draw!';return draw()}
 G.called.add(n);G.order.push(n);
 if(G.mode=='room')sendState();
 if(G.mode=='cpu'){const i=G.bcard.indexOf(n);
  if(i>=0)timers.push(setTimeout(()=>{if(G.over)return;if(Math.random()<.9)G.bmarked.add(i);
   if(won(G.bcard,G.bmarked,G.called)){G.over=true;record(false,'cpu');G.msg='🪲 Beetle shouts BINGO! Beetle wins.'}draw()},1200+Math.random()*1800))}
 draw()}
function claim(){if(G.over)return;
 if(won(G.card,G.marked,G.called)){G.over=true;G.msg='🎉 BINGO! You win! +'+record(true,G.mode)+' 🪙';if(room)room.emit('win',{name:AV.name})}
 else G.msg='Not yet — keep marking called items!';draw()}

function draw(){if(!G.mode)return;set(G.season);
 const last=G.order[G.order.length-1];
 const [em,...w]=(last||'⏳ Ready').split(' ');
 const canCall=G.mode=='room'&&G.host&&!G.over;
 app.innerHTML=`<div class="bar"><button class="alt sm" id="x">✕ Exit</button><b>${SEASONS[G.season].e} ${SEASONS[G.season].n} Bingo</b>
 ${G.mode=='cpu'?'<div class="mini">'+G.bcard.map((c,i)=>`<i class="${G.bmarked.has(i)?'m':''}"></i>`).join('')+'</div>':'<span></span>'}</div>
 ${G.mode=='room'?`<div class="code">${G.code}</div><p class="hist">${G.host?'You are the caller · share this code':'Joined as player'}</p><div class="peers">${(G.peers||[]).map(p=>`<span>${avSVG(p.av,34)}<small>${esc(p.av.name)}${p.me?' (you)':''}</small></span>`).join('')}</div>`:'<div class="vs">'+avSVG(AV,48)+'<b>vs</b>'+avSVG(BEETLE,48)+'</div><p class="hist">🪲 The beetle’s card is the little grid</p>'}
 <div class="call"><b>${em}</b>${w.join(' ')||(G.mode=='room'&&!G.host?'Waiting for first call':'Get ready…')}</div>
 <div class="hist">${G.order.slice(-6,-1).reverse().map(x=>x.split(' ')[0]).join(' ')}</div>
 <div class="grid">${G.card.map((c,i)=>{const f=c===null,m=G.marked.has(i);const p=f?['⭐','FREE']:[c.split(' ')[0],c.split(' ').slice(1).join(' ')];
 return `<button class="cell ${m?'m':''} ${G.called.has(c)?'called':''}" data-i="${i}"><b>${p[0]}</b>${p[1]}</button>`}).join('')}</div>
 <div class="msg">${G.msg||''}</div>
 ${canCall?'<button id="d">🎲 Draw next</button>':''}
 ${G.over?'<button id="again">Play again</button>':'<button id="bingo">🪲 BINGO!</button>'}`;
 $('#x').onclick=home;
 app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{if(G.over)return;const i=+b.dataset.i;if(i==12)return;G.marked.has(i)?G.marked.delete(i):G.marked.add(i);G.msg='';draw()});
 const d=$('#d');if(d)d.onclick=next;
 const bg=$('#bingo');if(bg)bg.onclick=claim;
 const a=$('#again');if(a)a.onclick=()=>G.mode=='cpu'?game('cpu'):home()}
home();
</script></body></html>
